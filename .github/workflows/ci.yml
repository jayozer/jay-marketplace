name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s goal-orchestrator/tests -p 'test_*.py' -v

      - name: Content validation
        run: |
          PYTHONDONTWRITEBYTECODE=1 uv run --quiet --with pyyaml python goal-orchestrator/scripts/validate_skills.py --check-content

      - name: Validate saved simulated runtime traces
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 goal-orchestrator/scripts/grade_runtime_trace.py goal-orchestrator/evals/fixtures/runtime-traces/forward-2026-09-10.json

      - name: Smoke suite
        run: |
          PYTHONDONTWRITEBYTECODE=1 bash goal-orchestrator/scripts/smoke_test.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate ./goal-orchestrator
